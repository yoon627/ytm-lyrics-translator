<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h3>YTM Lyrics Translator</h3>
    <label>Claude API Key
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
    </label>
    <label>대상 언어
      <input type="text" id="targetLang" value="Korean" />
    </label>
    <label class="row">
      <input type="checkbox" id="translationEnabled" checked /> 번역 켜기
    </label>
    <button id="save">저장</button>
    <div id="status"></div>
    <p class="hint">키는 이 브라우저(chrome.storage.local)에만 저장됩니다.</p>
    <script src="popup.js"></script>
  </body>
</html>
